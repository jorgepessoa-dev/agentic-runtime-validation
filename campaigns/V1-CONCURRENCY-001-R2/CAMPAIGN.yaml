  ACTIVE unexpired leases whose lease epoch matches both task and attempt must not
  exceed configured K.
- Target validator rejects max_concurrent_descendants=5 and 20 because immutable public
  M10 hard cap is 3.
failure_condition: 'Any sampled or final durable state exceeds configured K: FAIL
  immediately; preserve seed, full observations and DB dump. Any harness error/timeout:
  HARNESS_INVALID. No retry.'
sample_count: 1008
matrix:
  claimers:
  - 2
  - 10
  - 50
  - 100
  valid_k:
  - 1
  - 2
  - 3
  races_per_cell: 84
  invalid_k_rejection_probes:
  - 5
  - 20
  plan_shape: single accepted plan with seven independent queued root tasks
timing:
  sampler_interval_seconds: 0.002
  per-query_seeded_delay_seconds:
    select_max: 0.004
    task_update_max: 0.002
    transaction_commit_max: 0.004
  claim_start_jitter_max_seconds: 0.003
started_at: null
start_time_note: Manifest is immutable and committed before execution. Exact started_utc
  is recorded in RESULT.json immediately before the first fixture operation.
